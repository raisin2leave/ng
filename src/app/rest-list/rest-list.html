<div class="filters row g-3">
  <div class="col-md-3">
    <label for="search" class="form-label">Search:</label>
    <input
      id="search"
      type="text"
      class="form-control"
      placeholder="np. burger"
      [(ngModel)]="searchText"
    >
  </div>

  <div class="col-md-3">
    <label for="cuisine" class="form-label">Cuisine:</label>
    <select id="cuisine" class="form-select" [(ngModel)]="selectedCuisine">
      <option value="all">Wszystkie</option>
      @for (option of cuisineOptions; track option.value) {
        <option [value]="option.value">{{ option.label }}</option>
      }
    </select>
  </div>

  <div class="col-md-3">
    <label for="status" class="form-label">Status:</label>
    <select id="status" class="form-select" [(ngModel)]="selectedStatus">
      <option value="all">Wszystkie</option>
      <option value="open">Czynne teraz</option>
    </select>
  </div>

  <div class="col-md-3">
    <label for="sort" class="form-label">Sort:</label>
    <select id="sort" class="form-select" [(ngModel)]="sortBy">
      <option value="rating">Rating (najwyższy)</option>
      <option value="deliveryTime">Czas dostawy (najkrótszy)</option>
      <option value="deliveryFee">Koszt dostawy (najniższy)</option>
    </select>
  </div>

  <div class="col-12 text-end">
    <button type="button" class="btn btn-outline-secondary" (click)="resetFilters()">
      Resetuj filtry
    </button>
  </div>
</div>

<section class="restaurant-list">
  @for (restaurant of filteredRestaurants(); track restaurant.id) {
    <app-rest-card [restaurant]="restaurant" />
  } @empty {
    <p class="no-results">Nie znaleziono restauracji.</p>
  }
</section>
