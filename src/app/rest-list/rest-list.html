<div class="filters">
  <label for="search" class="form-label">Search:</label>
  <input
    id="search"
    type="text"
    class="form-control"
    placeholder="np. burger"
    [(ngModel)]="searchText"
  >
</div>

<section class="restaurant-list">
  @for (restaurant of filteredRestaurants(); track restaurant.id) {
    <app-rest-card [restaurant]="restaurant" />
  }
</section>
