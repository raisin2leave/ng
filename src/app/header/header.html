<header class="header">
  <a routerLink="/" class="brand">FoodApp</a>

  <nav class="nav-links" aria-label="Menu główne">
    <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
      Restauracje
    </a>

    @if (isAdmin()) {
      <a routerLink="/admin" routerLinkActive="active">Panel admina</a>
    }

    @if (currentUser(); as user) {
      <a routerLink="/profile" routerLinkActive="active" class="user-info" title="Mój profil">
        Zalogowano: <strong>{{ user.name }}</strong>
        @if (user.role === 'admin') {
          <span class="badge text-bg-warning">admin</span>
        }
      </a>
      <button type="button" class="logout-button" (click)="logOut()">Wyloguj</button>
    } @else {
      <a routerLink="/login" routerLinkActive="active">Zaloguj się</a>
      <a routerLink="/register" routerLinkActive="active">Załóż konto</a>
    }
  </nav>
</header>
