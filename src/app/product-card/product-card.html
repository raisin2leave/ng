<article class="product-card" [class.unavailable-card]="!product().isAvailable">

  <div class="product-image">
    @if (product().imageUrl; as imageUrl) {
      <img
        [ngSrc]="imageUrl"
        [alt]="product().name"
        fill
        sizes="(max-width: 700px) 100vw, 25vw"
        appImageFallback
      >
    } @else {
      <div class="no-image">Brak zdjęcia</div>
    }
  </div>

  <div class="product-info">
    <h4>{{ product().name }}</h4>

    <p class="description">{{ product().description }}</p>

    <div class="product-footer">
      <span class="price">{{ product().price | currency }}</span>

      @if (product().isAvailable) {
        <span class="availability available">Dostępny</span>
      } @else {
        <span class="availability unavailable">Niedostępny</span>
      }
    </div>

    <button
      type="button"
      class="btn btn-primary btn-sm add-button"
      [disabled]="!product().isAvailable || !canOrder()"
      (click)="onAddToCartClick()"
    >
      Dodaj do koszyka
    </button>
  </div>

</article>
